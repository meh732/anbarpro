<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Subtle inner grid lines -->
  <path d="M 64 160 H 448 M 64 256 H 448 M 64 352 H 448 M 160 64 V 448 M 256 64 V 448 M 352 64 V 448" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  
  <!-- Central Chip Body -->
  <rect x="144" y="144" width="224" height="224" rx="36" fill="#1e1b4b" stroke="url(#accent-grad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Chip Inner Core -->
  <rect x="184" y="184" width="144" height="144" rx="20" fill="url(#accent-grad)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="4" />
  
  <!-- Warehouse/Boxes Isometric Icon Inside Chip -->
  <path d="M 256 208 L 308 238 L 256 268 L 204 238 Z" fill="#38bdf8" />
  <path d="M 204 246 L 256 276 V 316 L 204 286 Z" fill="#0284c7" />
  <path d="M 256 276 L 308 246 V 286 L 256 316 Z" fill="#0369a1" />

  <!-- Electronic Pins Left -->
  <rect x="96" y="180" width="40" height="16" rx="6" fill="#38bdf8" />
  <rect x="96" y="220" width="40" height="16" rx="6" fill="#38bdf8" />
  <rect x="96" y="260" width="40" height="16" rx="6" fill="#38bdf8" />
  <rect x="96" y="300" width="40" height="16" rx="6" fill="#38bdf8" />

  <!-- Electronic Pins Right -->
  <rect x="376" y="180" width="40" height="16" rx="6" fill="#38bdf8" />
  <rect x="376" y="220" width="40" height="16" rx="6" fill="#38bdf8" />
  <rect x="376" y="260" width="40" height="16" rx="6" fill="#38bdf8" />
  <rect x="376" y="300" width="40" height="16" rx="6" fill="#38bdf8" />

  <!-- Electronic Pins Top -->
  <rect x="180" y="96" width="16" height="40" rx="6" fill="#38bdf8" />
  <rect x="220" y="96" width="16" height="40" rx="6" fill="#38bdf8" />
  <rect x="260" y="96" width="16" height="40" rx="6" fill="#38bdf8" />
  <rect x="300" y="96" width="16" height="40" rx="6" fill="#38bdf8" />

  <!-- Electronic Pins Bottom -->
  <rect x="180" y="376" width="16" height="40" rx="6" fill="#38bdf8" />
  <rect x="220" y="376" width="16" height="40" rx="6" fill="#38bdf8" />
  <rect x="260" y="376" width="16" height="40" rx="6" fill="#38bdf8" />
  <rect x="300" y="376" width="16" height="40" rx="6" fill="#38bdf8" />

  <!-- Active Status LED -->
  <circle cx="210" cy="210" r="10" fill="#10b981" />
</svg>
